# Author: yunnuo <ymz@ebox.vip>
name: Configure Ubuntu package mirrors
description: Use the signed Ubuntu archive through the kernel.org mirror.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Hosted Jammy runners use this mirror list for every Ubuntu suite.
        # The Ubuntu DNS zone can be unavailable on hosted runners.
        # This public archive mirror retains Ubuntu Release signature checks.
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
        fi
        # Older runner images reference Ubuntu hosts directly.
        sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|https\?://\(azure\.archive\|archive\|security\)\.ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' {} +
