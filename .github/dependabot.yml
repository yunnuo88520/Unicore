# Author: yunnuo <ymz@ebox.vip>
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Keep Node API types aligned with the Node 22 development/CI baseline.
    # Revisit alongside a deliberate runtime baseline upgrade; patch/minor stay enabled.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # These upgrades replace framework compiler/build APIs and require
      # a dedicated migration; retain fixes within the validated baselines.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
