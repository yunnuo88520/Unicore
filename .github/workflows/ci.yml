# Author: yunnuo <ymz@ebox.vip>
name: Quality and profile builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicore
          POSTGRES_PASSWORD: unicore_ci_test
          POSTGRES_DB: unicore_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U unicore -d unicore_test" --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: unicore_ci_root
          MYSQL_DATABASE: unicore_test
          MYSQL_USER: unicore
          MYSQL_PASSWORD: unicore_ci_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping --silent" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make test
        env:
          UNICORE_TEST_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/unicore_test?sslmode=disable
          UNICORE_TEST_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/unicore_test
      - run: pnpm build && make build-web build-cli
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-e2e
      - run: make release
      - uses: actions/upload-artifact@v4
        with: { name: web-cli-preview, path: build/releases/ }
  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: wails build -tags desktop
        working-directory: cmd/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: build/desktop/bin/
  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t unicore:preview .
