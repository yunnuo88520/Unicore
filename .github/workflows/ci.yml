# Author: yunnuo <ymz@ebox.vip>
name: Quality and profile builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicore
          POSTGRES_PASSWORD: unicore_ci_test
          POSTGRES_DB: unicore_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U unicore -d unicore_test" --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: unicore_ci_root
          MYSQL_DATABASE: unicore_test
          MYSQL_USER: unicore
          MYSQL_PASSWORD: unicore_ci_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping --silent" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # Full history: the main-push upgrade gate archives the previous release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ubuntu-mirrors
      - name: Install quality tooling
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare dedicated backup, announcement and file databases
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U unicore -d unicore_test -c 'CREATE DATABASE backup_source' -c 'CREATE DATABASE backup_target' -c 'CREATE DATABASE announcement_test' -c 'CREATE DATABASE file_test' -c 'CREATE DATABASE prefix_core' -c 'CREATE DATABASE prefix_platform' -c 'CREATE DATABASE installer_test' -c 'CREATE DATABASE api_token_test'
          docker exec -e MYSQL_PWD=unicore_ci_root ${{ job.services.mysql.id }} mysql -u root -e "CREATE DATABASE backup_source; CREATE DATABASE backup_target; CREATE DATABASE announcement_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE file_test; CREATE DATABASE prefix_core; CREATE DATABASE prefix_platform; CREATE DATABASE installer_test; CREATE DATABASE api_token_test; GRANT ALL ON backup_source.* TO 'unicore'@'%'; GRANT ALL ON backup_target.* TO 'unicore'@'%'; GRANT ALL ON announcement_test.* TO 'unicore'@'%'; GRANT ALL ON file_test.* TO 'unicore'@'%'; GRANT ALL ON prefix_core.* TO 'unicore'@'%'; GRANT ALL ON prefix_platform.* TO 'unicore'@'%'; GRANT ALL ON installer_test.* TO 'unicore'@'%'; GRANT ALL ON api_token_test.* TO 'unicore'@'%';"
      - name: Verify optional notes builds and retained data
        run: pnpm test:notes
      - run: make test
        env:
          UNICORE_MAINTENANCE_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/backup_source?sslmode=disable
          UNICORE_MAINTENANCE_POSTGRES_TARGET_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/backup_target?sslmode=disable
          UNICORE_MAINTENANCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          UNICORE_MAINTENANCE_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/backup_source
          UNICORE_MAINTENANCE_MYSQL_TARGET_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/backup_target
          UNICORE_MAINTENANCE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          UNICORE_FILE_TEST_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/file_test?sslmode=disable
          UNICORE_FILE_TEST_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/file_test
          UNICORE_PREFIX_TEST_POSTGRES_CORE_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/prefix_core?sslmode=disable
          UNICORE_PREFIX_TEST_POSTGRES_PLATFORM_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/prefix_platform?sslmode=disable
          UNICORE_PREFIX_TEST_MYSQL_CORE_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/prefix_core
          UNICORE_PREFIX_TEST_MYSQL_PLATFORM_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/prefix_platform
          UNICORE_INSTALL_TEST_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/installer_test?sslmode=disable
          UNICORE_INSTALL_TEST_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/installer_test
          UNICORE_TOKEN_TEST_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/api_token_test?sslmode=disable
          UNICORE_TOKEN_TEST_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/api_token_test
          UNICORE_TEST_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/unicore_test?sslmode=disable
          UNICORE_TEST_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/unicore_test
          UNICORE_ANNOUNCEMENT_POSTGRES_DSN: postgres://unicore:unicore_ci_test@127.0.0.1:5432/announcement_test?sslmode=disable
          UNICORE_ANNOUNCEMENT_MYSQL_DSN: unicore:unicore_ci_test@tcp(127.0.0.1:3306)/announcement_test
      - name: Verify a genuinely renamed downstream application
        if: hashFiles('project.provenance.json') == ''
        run: pnpm verify:derived
      - run: pnpm build && make build-web build-cli build-ops
      # Continuous cross-version gate on every push: upgrade a real instance from the
      # latest release tag, restart, and restore the pre-upgrade backup with the old
      # binary. Running on branch pushes keeps the rehearsal observable outside main.
      - name: Exercise a real cross-version upgrade from the latest release tag
        if: github.event_name == 'push'
        run: |
          tag="$(git describe --tags --abbrev=0 2>/dev/null)" || { echo 'No release tag exists yet; skipping the upgrade rehearsal.'; exit 0; }
          if [ "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)" ]; then
            tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)" || { echo 'No previous release tag exists; skipping the upgrade rehearsal.'; exit 0; }
          fi
          echo "Upgrading from $tag"
          make test-upgrade FROM_REF="$tag"
      - run: pnpm exec playwright install --with-deps chromium
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-acceptance
          path: |
            build/acceptance/
            test-results/
      - run: make test-features
      - run: make release
      - name: Exercise packaged Linux Web entry points
        run: node scripts/check-release-entrypoints.mjs web
      - uses: actions/upload-artifact@v7
        with: { name: web-cli-preview, path: build/releases/ }
  native-desktop:
    # Keep the protected check name stable while moving off the retired macOS 14 image.
    name: native-desktop (${{ matrix.check_name || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
        include:
          - os: macos-15
            check_name: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      # Full history: the Windows upgrade drill creates an application from the previous
      # release tag's source with its own freshly generated framework-template.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-mirrors
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
      - name: Verify signed update helpers on the native OS
        run: go test ./internal/updates ./internal/adapter/updatechannel ./internal/adapter/updateinstall
      # Windows acceptance for the cross-platform tooling: doctor must classify installed
      # pnpm correctly (not a spawn EINVAL misreport), and the suites the Windows upgrade
      # report flagged run on a real Windows checkout with the repository's own attributes.
      - name: Verify Windows tool invocation and cross-platform suites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe rg 2>$null; if ($LASTEXITCODE -ne 0) {
            # The chocolatey feed times out regularly; fetch a pinned ripgrep
            # release straight from GitHub and put it on the step PATH instead.
            $rg = Join-Path $env:RUNNER_TEMP 'ripgrep'
            Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip' -OutFile "$rg.zip"
            Expand-Archive "$rg.zip" -DestinationPath $rg -Force
            Add-Content $env:GITHUB_PATH "$rg\ripgrep-14.1.1-x86_64-pc-windows-msvc"
          }
          node scripts/doctor.mjs
          go test ./internal/adapter/bloblocal/ ./internal/branding/ ./internal/config/
          pnpm test:tooling
      - name: Verify native SQLite paths and desktop persistence
        run: go test ./internal/adapter/storage/sqlite ./internal/bootstrap/local
      - name: Install matching Wails CLI
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
      - run: make build-desktop
      - name: Launch real Windows desktop with isolated data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Windows'
        with: { name: windows-startup-evidence, path: build/acceptance/windows-startup/ }
      - name: Sign and notarize native desktop when configured
        if: github.event_name != 'pull_request' && vars.UNICORE_PLATFORM_SIGNING == 'required'
        run: node scripts/platform-sign.mjs
        env:
          UNICORE_PLATFORM_SIGNING: ${{ github.event_name != 'pull_request' && vars.UNICORE_PLATFORM_SIGNING || 'unsigned' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: make package-desktop
        env:
          UNICORE_PLATFORM_SIGNING: ${{ github.event_name != 'pull_request' && vars.UNICORE_PLATFORM_SIGNING || 'unsigned' }}
      - name: Verify native desktop downloads
        run: node scripts/check-release-entrypoints.mjs desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: build/native-releases/
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: windows-exe
          path: build/desktop/bin/*.exe
          if-no-files-found: error
      # The exported whitelist must keep every desktop input: build, package and verify a
      # genuinely renamed application on this native runner. Missing tray bridge files,
      # embedded images or DMG resources fail here instead of only at a downstream user.
      # Framework checkout only; a derived application has no template to re-export.
      - name: Verify the renamed derived application native desktop build
        if: hashFiles('project.provenance.json') == ''
        run: node scripts/verify-derived-project.mjs desktop
      # Windows executes the full customized derived-application drill (non-default brand,
      # independent migration namespace, module descriptor, docs, full tests and builds) on
      # a real Windows checkout — the cross-platform upgrade report's remaining evidence.
      - name: Verify the customized derived application full drill on Windows
        if: hashFiles('project.provenance.json') == '' && runner.os == 'Windows'
        run: node scripts/verify-derived-project.mjs full
      # And the path a real downstream actually walks: create from the previous release
      # template, commit customization, then framework:sync to the current template.
      - name: Verify a real old-template upgrade drill on Windows
        if: hashFiles('project.provenance.json') == '' && runner.os == 'Windows'
        run: node scripts/verify-derived-project.mjs upgrade
  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ubuntu-mirrors
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make docker-build
      - run: make package RELEASE_TARGETS=linux/amd64 RELEASE_PROFILES=web-platform,web-standalone
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker pull nginx:latest
      - run: make test-deploy
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: deployment-evidence, path: build/acceptance/deployment/ }
