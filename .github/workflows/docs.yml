# Author: yunnuo <ymz@ebox.vip>
name: Documentation site
on:
  push:
    branches: [main, dev]
    paths: ['website/**', 'docs/**', 'assets/brand/**', 'distribution/manifest.json', 'scripts/distribution.mjs', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'VERSION', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'assets/brand/**', 'distribution/manifest.json', 'scripts/distribution.mjs', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'VERSION', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website check
      - run: pnpm --dir website build
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: build/docs-site-dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yunnuo88520/Unicore'
        with:
          path: build/docs-site-dist/
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'yunnuo88520/Unicore'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
