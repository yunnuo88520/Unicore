# Author: yunnuo <ymz@ebox.vip>
name: Publish image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and push (for example v0.1.3)
        required: true
        type: string
      promote_floating_tag:
        description: Also move the major.minor floating tag (stable publications only)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      # Stamp the OCI revision label with the exact release commit so the image's source
      # identity is verifiable from the registry (release-completeness checks it).
      - name: Resolve the image source commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Floating-tag policy: only a stable (non-prerelease) publication moves the
      # major.minor tag that stable users track. Preview releases and manual candidate
      # builds push their exact version tag only, so an unpublished candidate can never
      # override the floating reference of published stable users.
      - name: Compute image tags
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.tag.outputs.tag }}"
          repo="${{ github.repository }}"
          version="${tag#v}"
          repo="${repo,,}"
          promote="${{ inputs.promote_floating_tag }}"
          if [ -z "$promote" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then promote=false; else promote=true; fi
          fi
          if [ "$promote" != "true" ]; then
            echo "Floating major.minor tag stays untouched; publishing ghcr.io/$repo:$version only."
            echo "tags=ghcr.io/$repo:$version" >> "$GITHUB_OUTPUT"
          else
            # A manual promotion must point at a published stable release; never trust the boolean alone.
            gh api "repos/$repo/releases/tags/$tag" > "$RUNNER_TEMP/release-check.json"
            node --input-type=module -e '
              import {readFileSync} from "node:fs";
              const release=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/release-check.json"));
              if(release.draft||release.prerelease) throw Error(`Refusing to move the floating tag: the release for tag ${release.tag_name} is draft=${release.draft} prerelease=${release.prerelease}; only a published stable release may advance the major.minor tag`);
            '
            echo "Promoting the floating tag for stable $version."
            echo "tags=ghcr.io/$repo:$version,ghcr.io/$repo:${version%.*}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.commit.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
