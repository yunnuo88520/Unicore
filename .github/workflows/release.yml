# Author: yunnuo <ymz@ebox.vip>
name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact VERSION already committed with CHANGELOG
        required: true
        type: string
      release_kind:
        description: Publication status for release notes; this workflow only prepares artifacts
        type: choice
        default: preview
        options:
          - preview
          - stable
      ci_run_id:
        description: Successful main Quality and profile builds run for this exact commit
        required: true
        type: string
      upgrade_from_ref:
        description: Trusted previous release tag or commit for the cross-version upgrade gate (the nearest official release; experimental 0.1.x tags are not upgrade sources)
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ubuntu-mirrors
      - name: Install quality tooling
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: test "$(cat VERSION)" = "$EXPECTED_VERSION"
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make docs && git diff --exit-code && make test
      - run: make release
      - run: cd build/releases && sha256sum --check checksums.txt
      - uses: actions/upload-artifact@v7
        with: { name: release-candidate, path: build/releases/, if-no-files-found: error }
  # Cross-version gate: a real old-release instance (dedicated database, settings, accounts,
  # notes and an uploaded attachment) is upgraded, restarted and its pre-upgrade backup is
  # restored with the matching old binary. Missing evidence or a failed dialect blocks the bundle.
  upgrade:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicore
          POSTGRES_PASSWORD: unicore_ci_test
          POSTGRES_DB: unicore_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U unicore" --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: unicore_ci_root
          MYSQL_USER: unicore
          MYSQL_PASSWORD: unicore_ci_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping --silent" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ubuntu-mirrors
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: make build-web build-ops
      - if: matrix.driver == 'postgres'
        run: docker exec ${{ job.services.postgres.id }} psql -U unicore -d unicore_test -c 'CREATE DATABASE upgrade_source' -c 'CREATE DATABASE upgrade_restore'
      - if: matrix.driver == 'mysql'
        run: docker exec -e MYSQL_PWD=unicore_ci_root ${{ job.services.mysql.id }} mysql -u root -e "CREATE DATABASE upgrade_source; CREATE DATABASE upgrade_restore; GRANT ALL ON upgrade_source.* TO 'unicore'@'%'; GRANT ALL ON upgrade_restore.* TO 'unicore'@'%';"
      - name: Exercise the cross-version upgrade, restart and restore rehearsal
        env:
          UPGRADE_FROM_REF: ${{ inputs.upgrade_from_ref }}
          UPGRADE_DRIVER: ${{ matrix.driver }}
          UPGRADE_DSN: ${{ matrix.driver == 'postgres' && 'postgres://unicore:unicore_ci_test@127.0.0.1:5432/upgrade_source?sslmode=disable' || matrix.driver == 'mysql' && 'unicore:unicore_ci_test@tcp(127.0.0.1:3306)/upgrade_source' || '' }}
          UPGRADE_RESTORE_DSN: ${{ matrix.driver == 'postgres' && 'postgres://unicore:unicore_ci_test@127.0.0.1:5432/upgrade_restore?sslmode=disable' || matrix.driver == 'mysql' && 'unicore:unicore_ci_test@tcp(127.0.0.1:3306)/upgrade_restore' || '' }}
          UNICORE_MAINTENANCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          UNICORE_MAINTENANCE_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: node scripts/test-upgrade.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-evidence-${{ matrix.driver }}
          path: build/acceptance/developer-kit/
          if-no-files-found: error
  bundle:
    needs: [candidate, upgrade]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Verify native build source and result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/release-ci.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const run=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/release-ci.json")); if(run.head_sha!==process.env.GITHUB_SHA || run.head_branch!=="main" || run.event!=="push" || run.name!=="Quality and profile builds" || run.conclusion!=="success") throw Error("Native CI must pass on this exact main commit");'
      - name: Require successful dependency security on the same main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=10" > "$RUNNER_TEMP/release-security.json"
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const runs=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/release-security.json")).workflow_runs; const run=runs.find(r=>r.head_sha===process.env.GITHUB_SHA&&r.head_branch==="main"&&r.event==="push"&&r.conclusion==="success"); if(!run) throw Error("Dependency security must pass on this exact main commit"); appendFileSync(process.env.GITHUB_ENV,`SECURITY_RUN_ID=${run.id}\n`);'
      - uses: actions/download-artifact@v8
        with: { name: release-candidate, path: build/candidate }
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: build/candidate
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release-assets.mjs assemble build/candidate
      - name: Sign OTA manifest with the committed publisher trust root
        run: node scripts/update-sign.mjs build/candidate
        env:
          UNICORE_UPDATE_SIGNING_KEY: ${{ secrets.UNICORE_UPDATE_SIGNING_KEY }}
      - run: cd build/candidate && sha256sum --check checksums.txt
      - name: Generate bilingual release notes from the committed Changelog
        run: node scripts/release-notes.mjs build/candidate
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_KIND: ${{ inputs.release_kind }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/candidate/*
      - uses: actions/upload-artifact@v7
        with: { name: release-bundle, path: build/candidate/, if-no-files-found: error }
