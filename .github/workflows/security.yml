name: Dependency security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v6
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare native dependency metadata
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck -tags=updater ./cmd/server ./cmd/cli ./cmd/ops
      - run: govulncheck -scan=package ./...
      - run: govulncheck -tags=bindings,updater -scan=package ./cmd/desktop
      - run: pnpm audit --audit-level=low
