# Author: yunnuo <ymz@ebox.vip>
name: Publish framework template
on:
  workflow_run:
    workflows: [Quality and profile builds]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: framework-template-publication
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'yunnuo88520/Unicore' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish the tested current main as a linear template update
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo 'A newer main exists; its successful CI will publish the template.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/framework-template.mjs
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo 'Main changed during export; leave publication to its successful CI.'
            exit 0
          fi
          git push origin framework-template
