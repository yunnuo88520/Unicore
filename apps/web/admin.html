<!doctype html>

<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#6662ec" /><meta name="description" content="Unicore · 一份核心，运行于每个终端" /><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="icon" href="/favicon.ico" sizes="any" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" /><link rel="manifest" href="/site.webmanifest" /><title>Unicore · 管理后台</title></head><body><div id="root"><div id="boot" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif">
<style>#boot{background:radial-gradient(560px 420px at 50% 42%,#eef0fb 0%,#f7f8fa 62%);color:#3d4351}#boot-logo{width:52px;height:52px;filter:drop-shadow(0 10px 24px rgba(102,98,236,.32));animation:boot-float 2.6s ease-in-out infinite}#boot-bar{position:relative;overflow:hidden;width:196px;height:4px;margin-top:24px;border-radius:999px;background:#e7e9ee}#boot-bar::after{content:'';position:absolute;top:0;bottom:0;width:38%;border-radius:999px;background:#6662ec;animation:boot-slide 1.2s ease-in-out infinite}#boot-hint{margin-top:14px;font-size:12px;color:#6f7686}#boot-slow{display:none;margin-top:28px;align-items:center;gap:10px;font-size:13px;opacity:0;transition:opacity .4s ease,display .4s allow-discrete}#boot-slow.boot-show{display:flex;opacity:1}@starting-style{#boot-slow.boot-show{opacity:0}}#boot-slow button{cursor:pointer;border:1px solid #d4d7df;border-radius:999px;background:transparent;color:inherit;padding:5px 14px;font-size:13px;transition:background .15s ease}#boot-slow button:hover{background:rgba(102,98,236,.08)}@media (prefers-color-scheme:dark){#boot{background:radial-gradient(560px 420px at 50% 42%,#1b1e28 0%,#14161c 62%);color:#c9ced9}#boot-bar{background:#2a2e38}#boot-hint{color:#767d8c}#boot-slow button{border-color:#3a3f4b}#boot-slow button:hover{background:rgba(102,98,236,.16)}}@keyframes boot-slide{0%{left:-38%}100%{left:100%}}@keyframes boot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media (prefers-reduced-motion:reduce){#boot-logo,#boot-bar::after{animation:none}}</style>
<svg id="boot-logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#6662ec"/><path d="M17 16v22c0 9 6 15 15 15s15-6 15-15V16h-9v22c0 4-2 6-6 6s-6-2-6-6V16z" fill="#fff"/><path d="m32 10 6 6-6 6-6-6z" fill="#fff"/></svg>
<div id="boot-bar" aria-hidden="true"></div>
<div id="boot-hint">正在加载 · Loading</div>
<div id="boot-slow"><span>加载时间过长 · Still loading?</span><button type="button">重新加载 Reload</button></div>
</div></div><script defer src="/boot-fallback.js"></script><script type="module" src="/src/admin.tsx"></script></body></html>
