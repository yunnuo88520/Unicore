<!doctype html>

<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#6662ec" /><meta name="description" content="Unicore · 一份核心，运行于每个终端" /><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="icon" href="/favicon.ico" sizes="any" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" /><link rel="manifest" href="/site.webmanifest" /><title>Unicore · 工作空间</title></head><body><div id="root"><div id="boot" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;background:#f7f8fa;color:#3d4351">
<style>@media (prefers-color-scheme:dark){#boot{background:#14161c;color:#c9ced9}#boot-bar{background:#2a2e38}#boot-bar::after{background:#6662ec}}#boot-bar{position:relative;overflow:hidden;width:168px;height:4px;border-radius:999px;background:#e7e9ee}#boot-bar::after{content:'';position:absolute;inset:0;width:38%;border-radius:999px;background:#6662ec;animation:boot-slide 1.1s ease-in-out infinite}@keyframes boot-slide{0%{left:-38%}100%{left:100%}}</style>
<div id="boot-bar" aria-hidden="true"></div>
<span id="boot-slow" style="display:none;align-items:center;gap:10px;font-size:13px"><span>加载时间过长 · Still loading?</span><button type="button" onclick="location.reload()" style="cursor:pointer;border:1px solid #c9ced9;border-radius:8px;background:transparent;color:inherit;padding:5px 12px;font-size:13px">重新加载 Reload</button></span>
<script>setTimeout(function(){var slow=document.getElementById('boot-slow');if(slow)slow.style.display='flex';},8000)</script>
</div></div><script type="module" src="/src/main.tsx"></script></body></html>
