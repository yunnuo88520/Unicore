# Author: yunnuo <ymz@ebox.vip>
# Disposable local dependencies only; named volumes are retained until explicitly removed.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: unicore
      POSTGRES_PASSWORD: ${UNICORE_DEV_DB_PASSWORD:?Set UNICORE_DEV_DB_PASSWORD for disposable local services}
      POSTGRES_DB: unicore
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U unicore"], interval: 3s, timeout: 3s, retries: 20}
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${UNICORE_DEV_DB_PASSWORD:?Set UNICORE_DEV_DB_PASSWORD}
      MYSQL_DATABASE: unicore
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql:/var/lib/mysql"]
    healthcheck: {test: ["CMD-SHELL", "mysqladmin ping --silent"], interval: 3s, timeout: 3s, retries: 30}
  minio:
    image: ${UNICORE_DEV_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${UNICORE_DEV_MINIO_ACCESS_KEY:?Set UNICORE_DEV_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${UNICORE_DEV_MINIO_SECRET_KEY:?Set UNICORE_DEV_MINIO_SECRET_KEY}
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:19001:9001"]
    volumes: ["minio:/data"]
  mail:
    image: ghcr.io/axllent/mailpit:v1.27.0
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
volumes:
  postgres:
  mysql:
  minio:
